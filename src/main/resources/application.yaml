spring:
  application:
    name: retreat-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tc2lnbmluZy1taW4tNjQtYnl0ZXMtbG9uZw==}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# Stripe Configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# App Configuration
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}

# Retreat Configuration
mail:
  from: ${MAIL_FROM:noreply@norcalmensretreat.com}

retreat:
  year: 2026
  cost-per-person: 288.00
  max-attendees: 200
  contact-email: ${RETREAT_CONTACT_EMAIL:info@norcalmensretreat.com}
