spring:
 application:
   name: church-backend
 datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

 jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

 # Mail: reads the MAIL_* env vars that are already set on Railway.
 # Spring Boot only autoconfigures JavaMailSender when spring.mail.host
 # has a value, so an unset MAIL_HOST leaves email disabled (EmailService
 # bean skipped) without crashing startup. Callers that need email fall
 # back to their own error handling.
 mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}

 logging:
  level:
    com.norcalretreat: INFO
    org.hibernate: WARN

# Stripe Configuration — empty defaults so a missing env var (e.g. the optional
# STRIPE_WEBHOOK_SECRET) does not crash app startup; calls that need the key
# will fail with a clean runtime error instead of taking the whole backend down.
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

app:
  frontend-url: ${APP_FRONTEND_URL:https://norcalmensretreat.com}
