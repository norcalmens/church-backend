spring:
 application:
   name: church-backend
 datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

 jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

 logging:
  level:
    com.norcalretreat: INFO
    org.hibernate: WARN

# Stripe Configuration — empty defaults so a missing env var (e.g. the optional
# STRIPE_WEBHOOK_SECRET) does not crash app startup; calls that need the key
# will fail with a clean runtime error instead of taking the whole backend down.
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

app:
  frontend-url: ${APP_FRONTEND_URL:https://norcalmensretreat.com}
